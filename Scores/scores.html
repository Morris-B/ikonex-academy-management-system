<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Scores Management</title>

<!-- <link rel="stylesheet" href="../css/style.css"> -->

<style>

/* =========================
   GLOBAL RESET
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    overflow:hidden; /* prevents page scrolling */
}

/* =========================
   SIDEBAR
========================= */
.sidebar{
    width:250px;
    height:100vh;
    background:#1f2937;
    color:white;
    position:fixed;
    left:0;
    top:0;
    padding:20px;
    overflow-y:auto;
}

.sidebar h2{
    text-align:center;
    margin-bottom:30px;
}

.sidebar ul{
    list-style:none;
}

.sidebar ul li{
    margin-bottom:15px;
}

.sidebar ul li a{
    text-decoration:none;
    color:white;
    display:block;
    padding:12px;
    border-radius:8px;
}

.sidebar ul li a:hover{
    background:#374151;
}

/* =========================
   MAIN LAYOUT WRAPPER
========================= */
.container{
    margin-left:250px;
    height:100vh;
    overflow:hidden;

    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;

    gap:15px;
    padding:15px;
}

/* =========================
   CARDS (FIXED GRID PANELS)
========================= */
.card{
    background:white;
    border-radius:12px;
    padding:15px;
    box-shadow:0 3px 10px rgba(0,0,0,0.15);

    overflow:auto; /* important: scroll inside card only */
}

/* =========================
   INPUT FIELDS
========================= */
.card input,
.card select{
    width:100%;
    padding:10px;
    margin-top:8px;
    margin-bottom:10px;
    border:1px solid #ccc;
    border-radius:8px;
}

/* =========================
   BUTTONS
========================= */
.card button{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
    margin-right:8px;
}

.card button:hover{
    background:#1d4ed8;
}

/* =========================
   TABLE FIX
========================= */
table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
}

table th{
    background:#2563eb;
    color:white;
    padding:10px;
}

table td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

/* =========================
   AUTOCOMPLETE FIX
========================= */
.autocomplete{
    position:relative;
    width:100%;
}

.suggestions{
    position:absolute;
    width:100%;
    background:white;
    border:1px solid #ccc;
    max-height:150px;
    overflow-y:auto;
    z-index:999;
}

.suggestions div{
    padding:8px;
    cursor:pointer;
}

.suggestions div:hover{
    background:#f1f1f1;
}

/* =========================
   RESPONSIVE (MOBILE)
========================= */
@media (max-width: 900px){
    .container{
        grid-template-columns:1fr;
        grid-template-rows:auto;
        overflow:auto;
        height:auto;
    }

    body{
        overflow:auto;
    }
}
</style>

</head>
<body>
    <div class="container">

    <!-- Sidebar -->
   <div class="sidebar">

        <h2>IKONEX ACADEMY</h2>

        <ul>
            <li><a href="../index.html">Dashboard</a></li>
                        <li><a href="../Student info management/students.html">Students</a></li>
            <li><a href="../Class streams/classstreams.html">Class Streams</a></li>
            <li><a href="../Subjects/subjects.html">Subjects</a></li>
            <li><a href="../Reports/reports.html">Reports</a></li>
        </ul>

</div>
<div class="card">
<h1>Scores Management</h1>

<form id="scoreForm">

<div class="autocomplete">

<input
type="text"
id="studentName"
placeholder="Type Student Name"
required>

<div id="studentSuggestions" class="suggestions"></div>

</div>

<br>

<div class="autocomplete">

<input
type="text"
id="subjectName"
placeholder="Type Subject Name"
required>

<div id="subjectSuggestions" class="suggestions"></div>

</div>

<br>

<input type="number" id="catScore" placeholder="CAT Score" required>

<input type="number" id="examScore" placeholder="Exam Score" required>

<button type="submit">
Save Score
</button>

</form>

<hr>
</div>
<div class="card">
<h2>Search Scores</h2>

<input
type="number"
id="passMark"
placeholder="Marks above">

<button onclick="searchScores()">
Search
</button>

<button onclick="clearSearch()">
Clear
</button>

<hr>
</div>
<div class="card">
<h2>Statistics</h2>

<select id="statsSubject">
</select>

<button onclick="getStatistics()">
    Get Statistics
</button>

<button onclick="clearStatistics()">
    Clear
</button>

<p id="statistics"></p>


<hr>
</div>
<div class="card">

<table border="1">

<thead>
<tr>

<th>Student</th>
<th>Subject</th>
<th>CAT</th>
<th>Exam</th>
<th>Total</th>
<th>Grade</th>
<th>Actions</th>

</tr>
</thead>

<tbody id="scoreTable"></tbody>

</table>
</div>
<div class="card">

<h2>Student Performance</h2>

<input
type="text"
id="performanceStudent"
placeholder="Admission Number">

<button onclick="viewStudentPerformance()">
View Performance
</button>

<div id="performanceResult"></div>

</div>
<div class="card">

<div class="card">

    <h2>Class Performance</h2>

    <select id="classPerformance">

        <option value="">
            Select Class
        </option>

    </select>

    <select id="subjectPerformance">

        <option value="">
            Select Subject
        </option>

    </select>

    <button onclick="viewClassPerformance()">
        View Class Performance
    </button>

    <div id="classPerformanceResult"></div>

</div>
<script src="./scores.js"></script>

</body>
</html>
